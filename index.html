<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Movilador Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    header {
      width: 100%;
      padding: 12px 24px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .status-panel { display: flex; gap: 12px; font-size: 14px; }
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      background: #334155;
      color: #94a3b8;
      font-weight: bold;
    }
    .badge.active { background: #15803d; color: #f0fdf4; }
    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      position: relative;
      background: #020617;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h2>MINI MOVILADOR WEB</h2>
    <div class="status-panel">
      <span id="st-usb" class="badge">USB 🔴</span>
      <span id="st-adb" class="badge">ADB 🔴</span>
      <span id="st-scrcpy" class="badge">SCRCPY 🔴</span>
      <span id="st-input" class="badge">CONTROL 🔴</span>
    </div>
  </header>

  <div class="main-container">
    <canvas id="screen-canvas"></canvas>
    <div class="controls">
      <button id="btn-connect">Conectar Teléfono USB</button>
      <button id="btn-pointer" disabled>Capturar Mouse (Modo Juego)</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
